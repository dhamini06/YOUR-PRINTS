version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yourprints-db
    environment:
      POSTGRES_USER: ${DB_USER:-yourprints_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourprints_insecure_dev_password}
      POSTGRES_DB: ${DB_NAME:-yourprints_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yourprints_user} -d ${DB_NAME:-yourprints_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yourprints-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-yourprints_user}:${DB_PASSWORD:-yourprints_insecure_dev_password}@postgres:5432/${DB_NAME:-yourprints_db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      INVESTIGATION_TIMEOUT_SECONDS: ${INVESTIGATION_TIMEOUT_SECONDS:-15}
      PER_PROVIDER_TIMEOUT_SECONDS: ${PER_PROVIDER_TIMEOUT_SECONDS:-5}
      MAX_CONCURRENT_INVESTIGATIONS: ${MAX_CONCURRENT_INVESTIGATIONS:-10}
      INVESTIGATION_TTL_HOURS: ${INVESTIGATION_TTL_HOURS:-48}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yourprints-frontend
    environment:
      # In container-to-container networking, the frontend server calls backend via container name
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
